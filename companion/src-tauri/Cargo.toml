[package]
name = "quadra-companion"
version = "0.3.0"
description = "Desktop companion for the Quadra haptic knob"
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"

[lib]
name = "quadra_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
hidapi = { version = "2.6", default-features = false, features = ["macos-shared-device"] }
# WiFi link (NanoDepsidf/src/net_link.h): HMAC-SHA256 handshake, AES-256-GCM frames.
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.3"
libc = "0.2"
serde_json = "1"
# HOME's lamp import (src/home.rs): miIO is AES-128-CBC with MD5 keys.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
md5 = { package = "md-5", version = "0.10" }
# The Synths page's monitor (src/midi.rs): the knob's USB MIDI port.
midir = "0.10"
tauri-plugin-dialog = "2"

# The knob's controls over WiFi (src/input.rs): CGEvent for keys, the mouse and the wheel; NSEvent
# for media keys; Accessibility's trust check.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = { version = "0.3", features = ["CGEvent", "CGEventTypes", "CGEventSource", "CGRemoteOperation"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSGraphicsContext", "objc2-core-graphics"] }
core-foundation = "0.10"

# Windows: the same controls through SendInput (src/input_windows.rs), and an IPv4-only name
# lookup for the WiFi link (lib.rs resolve_v4).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
